name: Test

# The gate: every push to master and every PR, and build-push.yml calls it so
# a release tag can't push images unless these pass. Keep in sync with the
# README's "Local checks".
on:
  push:
    branches: [master]
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -race ./...

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Same Node major as web/frontend/Dockerfile.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
