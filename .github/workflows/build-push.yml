name: Build and push images

# Release model: images are built and pushed only for `v*` tags. A manual
# run (workflow_dispatch) pushes the tag name when started from a tag ref,
# and only the commit SHA when started from a branch. There is no "latest" tag:
# deployments pin a release tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-push:
    needs: test
    strategy:
      matrix:
        include:
          - image: scraper
            context: .
            dockerfile: cmd/scraper/Dockerfile
          - image: telegram-notifier
            context: .
            dockerfile: cmd/telegram-notifier/Dockerfile
          - image: email-notifier
            context: .
            dockerfile: cmd/email-notifier/Dockerfile
          - image: web-ui-api
            context: .
            dockerfile: cmd/web-ui-api/Dockerfile
          - image: web-ui-frontend
            context: web/frontend
            dockerfile: web/frontend/Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Deploy target is an all-Raspberry-Pi (arm64) k3s cluster; amd64 is
      # kept too so images still run on a dev machine / other runners.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/ticket-live-event-scanner-{1}:{2}', github.repository_owner, matrix.image, github.ref_name) || format('ghcr.io/{0}/ticket-live-event-scanner-{1}:{2}', github.repository_owner, matrix.image, github.sha) }}
