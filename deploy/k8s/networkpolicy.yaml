# Ingress policies for the ticket-scanner namespace. Only ingress is
# restricted; egress is left open (web-ui-api fetches ticketline.pt, calls Telegram and the SMTP relay
# and reads its own SQLite volume). They need a CNI that enforces NetworkPolicy (k3s does, through its
# embedded kube-router controller).
---
# (a) Deny all ingress to every pod in the namespace unless a policy below
# allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ticket-scanner
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# (b) NATS: client port 4222 only from the pods labelled app=web-ui-api (the drain check runs as one).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-from-services
  namespace: ticket-scanner
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - web-ui-api
    ports:
    - protocol: TCP
      port: 4222
---
# (c) web-ui-api (8080, API and dashboard): from any pod in this
# namespace and from kube-system, where k3s runs the Traefik ingress
# controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ui-from-namespace-and-ingress
  namespace: ticket-scanner
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - web-ui-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 8080
