apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-ui-api-data
  namespace: ticket-scanner
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui-api
  namespace: ticket-scanner
  labels:
    app: web-ui-api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: web-ui-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui-api
  namespace: ticket-scanner
  labels:
    app: web-ui-api
  annotations:
    description: "Web UI API backend. CAUTION: This deployment MUST remain at 1 replica: it owns the SQLite file on its ReadWriteOnce volume."
spec:
  replicas: 1
  # One pod owns the SQLite file: stop the old one before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-ui-api
  template:
    metadata:
      labels:
        app: web-ui-api
    spec:
      securityContext:
        fsGroup: 1000
      automountServiceAccountToken: false
      containers:
      - name: web-ui-api
        image: ticket-scanner/web-ui-api:local
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - name: http
          containerPort: 8080
        env:
        # Optional NATS credentials (the broker here runs without auth). Set at most
        # one form: NATS_TOKEN, NATS_USER + NATS_PASSWORD, or NATS_CREDS (path to
        # a .creds file); a half-set pair stops the service. Source them from a Secret.
        - name: NATS_URL
          value: "nats://nats:4222"
        # The SQLite database, on the web-ui-api-data volume.
        - name: DATABASE_PATH
          value: "/data/ticket-scanner.db"
        # Only to move an existing sqld database into the new SQLite file, once:
        # a new file is filled from this server at start-up, and the process does
        # not start unless the copy verifies. Drop both after the first start, or
        # skip the Secret on a fresh install (optional).
        - name: TURSO_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: turso-credentials
              key: database_url
              optional: true
        - name: TURSO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: turso-credentials
              key: auth_token
              optional: true
        - name: LISTEN_ADDR
          value: ":8080"
        # The scraper and the weekly digest run in this process (formerly the
        # scraper CronJobs): a scrape at start-up and then every hour, the digest
        # on Sunday 19:00 Lisbon. SCRAPER_ENABLED=false turns both off. Run one by
        # hand: kubectl exec deploy/web-ui-api -- /app/web-ui-api --scrape-once
        # Seeds the watches table when it is empty; after that the hubs are
        # managed on the dashboard's Watches page.
        - name: TICKETLINE_HUB_PAGES
          value: "auchan-live-academia-maia-98164,auchan-live-academia-aveiro-98167"
        - name: USER_AGENT
          value: "ticket-live-event-scanner/0.1 (personal project; contact: jfms7s@gmail.com)"
        - name: REQUEST_DELAY_MS
          value: "1500"
        # The delivery channels (formerly the telegram-notifier and email-notifier
        # pods). A channel whose variables are not all set is disabled, not fatal
        # (see ticket_scanner_notifier_enabled on /metrics); the Secrets are optional.
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-bot-token
              key: bot_token
              optional: true
        - name: TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: telegram-bot-token
              key: chat_id
              optional: true
        # Optional: TELEGRAM_MIN_SEND_INTERVAL, minimum time between sends (Go duration, default 3s, 0 = off)
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: host
              optional: true
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: port
              optional: true
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: username
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: password
              optional: true
        - name: EMAIL_FROM
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: from
              optional: true
        - name: EMAIL_TO
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: to
              optional: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: web-ui-api-data
