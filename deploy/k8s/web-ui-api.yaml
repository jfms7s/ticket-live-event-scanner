apiVersion: v1
kind: Service
metadata:
  name: web-ui-api
  namespace: ticket-scanner
  labels:
    app: web-ui-api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: web-ui-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui-api
  namespace: ticket-scanner
  labels:
    app: web-ui-api
  annotations:
    description: "Web UI API backend. CAUTION: This deployment MUST remain at 1 replica. Multiple replicas would cause data duplication in Turso (multiple replicas consuming the same JetStream consumer group). Use pod disruption budgets or scaling restrictions if needed."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui-api
  template:
    metadata:
      labels:
        app: web-ui-api
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web-ui-api
        image: ticket-scanner/web-ui-api:local
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - name: http
          containerPort: 8080
        env:
        # Optional NATS credentials (the broker here runs without auth). Set at most
        # one form: NATS_TOKEN, NATS_USER + NATS_PASSWORD, or NATS_CREDS (path to
        # a .creds file); a half-set pair stops the service. Source them from a Secret.
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: TURSO_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: turso-credentials
              key: database_url
        - name: TURSO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: turso-credentials
              key: auth_token
        - name: LISTEN_ADDR
          value: ":8080"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
