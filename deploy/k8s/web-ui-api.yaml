apiVersion: v1
kind: Service
metadata:
  name: web-ui-api
  namespace: ticket-scanner
  labels:
    app: web-ui-api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: web-ui-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui-api
  namespace: ticket-scanner
  labels:
    app: web-ui-api
  annotations:
    description: "Web UI API backend. CAUTION: This deployment MUST remain at 1 replica. Multiple replicas would cause data duplication in Turso (multiple replicas consuming the same JetStream consumer group). Use pod disruption budgets or scaling restrictions if needed."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui-api
  template:
    metadata:
      labels:
        app: web-ui-api
    spec:
      containers:
      - name: web-ui-api
        image: ticket-scanner/web-ui-api:local
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: TURSO_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: turso-credentials
              key: database_url
        - name: TURSO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: turso-credentials
              key: auth_token
        - name: LISTEN_ADDR
          value: ":8080"
        - name: CORS_ORIGIN
          # web-ui-frontend runs as a separate Service/origin in-cluster, so the
          # browser-side dashboard needs CORS to call this API at all. "*" is
          # acceptable here per the already-confirmed no-auth, cluster-internal-only
          # decision (docs/design.md §2) — nothing sensitive is exposed by relaxing
          # this since the whole API is unauthenticated and unreachable externally.
          value: "*"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
