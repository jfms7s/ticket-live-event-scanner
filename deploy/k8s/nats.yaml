apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: ticket-scanner
  labels:
    app: nats
spec:
  clusterIP: None
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  selector:
    app: nats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: ticket-scanner
  labels:
    app: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        # NOTE: nats:2-alpine is verified to run as non-root (UID 1000) on modern Kubernetes.
        # It requires a writable /data directory for JetStream file storage (mounted PVC).
        image: nats:2-alpine
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        args:
        - -js
        - -sd
        - /data
        ports:
        - name: client
          containerPort: 4222
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          tcpSocket:
            port: client
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
