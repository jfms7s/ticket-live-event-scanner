# ============================================================================
# EXAMPLE SECRETS — DO NOT USE IN PRODUCTION
# ============================================================================
# These are PLACEHOLDER SECRETS with fake values. Before applying the
# manifests in deploy/k8s, you MUST create real secrets with your actual
# credentials. Do NOT commit real secrets to the repository.
#
# To create the secrets, run (after filling in real values):
#
#   kubectl create secret generic turso-credentials \
#     --from-literal=database_url='libsql://your-db-id.turso.io' \
#     --from-literal=auth_token='CHANGEME-REAL-TOKEN' \
#     -n ticket-scanner
#
#   kubectl create secret generic telegram-bot-token \
#     --from-literal=bot_token='123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefgh' \
#     --from-literal=chat_id='987654321' \
#     -n ticket-scanner
#
#   kubectl create secret generic smtp-credentials \
#     --from-literal=host='smtp.example.com' \
#     --from-literal=port='587' \
#     --from-literal=username='notifier@example.com' \
#     --from-literal=password='CHANGEME-REAL-PASSWORD' \
#     --from-literal=from='notifier@example.com' \
#     --from-literal=to='you@example.com' \
#     -n ticket-scanner
#
# ============================================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: turso-credentials
  namespace: ticket-scanner
type: Opaque
stringData:
  database_url: "libsql://CHANGEME-DB-ID.turso.io"
  auth_token: "CHANGEME-REAL-TOKEN-HERE"

---
apiVersion: v1
kind: Secret
metadata:
  name: telegram-bot-token
  namespace: ticket-scanner
type: Opaque
stringData:
  bot_token: "CHANGEME-TELEGRAM-BOT-TOKEN"
  chat_id: "CHANGEME-TELEGRAM-CHAT-ID"

---
apiVersion: v1
kind: Secret
metadata:
  name: smtp-credentials
  namespace: ticket-scanner
type: Opaque
stringData:
  host: "smtp.example.com"
  port: "587"
  username: "notifier@example.com"
  password: "CHANGEME-REAL-PASSWORD"
  from: "notifier@example.com"
  to: "you@example.com"
