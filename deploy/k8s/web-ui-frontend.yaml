apiVersion: v1
kind: Service
metadata:
  name: web-ui-frontend
  namespace: ticket-scanner
  labels:
    app: web-ui-frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 3000
  selector:
    app: web-ui-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui-frontend
  namespace: ticket-scanner
  labels:
    app: web-ui-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui-frontend
  template:
    metadata:
      labels:
        app: web-ui-frontend
    spec:
      containers:
      - name: web-ui-frontend
        image: ticket-scanner/web-ui-frontend:local
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: API_BASE_URL
          value: "http://web-ui-api"
        - name: PORT
          value: "3000"
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
