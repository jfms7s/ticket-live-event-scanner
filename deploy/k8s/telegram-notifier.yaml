apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-notifier
  namespace: ticket-scanner
  labels:
    app: telegram-notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-notifier
  template:
    metadata:
      labels:
        app: telegram-notifier
    spec:
      automountServiceAccountToken: false
      containers:
      - name: telegram-notifier
        image: ticket-scanner/telegram-notifier:local
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-bot-token
              key: bot_token
        - name: TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: telegram-bot-token
              key: chat_id
        # Optional: minimum time between sends (Go duration, default 3s, 0 = off)
        # - name: TELEGRAM_MIN_SEND_INTERVAL
        #   value: "3s"
        # The notifier rewrites /tmp/healthy every 15 s while NATS and its
        # consumer answer; a file older than 90 s means it stopped receiving.
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - 'test $(( $(date +%s) - $(cat /tmp/healthy) )) -lt 90'
          initialDelaySeconds: 20
          periodSeconds: 30
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: tmp
        emptyDir: {}
