# Local development stack. Mirrors deploy/k8s but swaps Turso for a local
# libsql-server (sqld) container so the stack runs with no external cloud
# dependencies besides Telegram and the SMTP relay.
#
# Usage:
#   cp .env.example .env   # fill in the Telegram and SMTP variables (see .env.example)
#   docker compose up --build
#   docker compose exec web-ui-api /app/web-ui-api --scrape-once   # scrape now (it also runs every hour)

services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33 # same as production (helm-argo-cd)
    environment:
      SQLD_NODE: primary
    volumes:
      - libsql-data:/var/lib/sqld
    ports:
      - "127.0.0.1:8081:8080"

  nats:
    # Floating 2.x tag on purpose; Dependabot (docker, /) proposes pinned bumps.
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-ui-api:
    build:
      context: .
      dockerfile: cmd/web-ui-api/Dockerfile
    depends_on:
      nats:
        condition: service_healthy
      libsql:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      TURSO_DATABASE_URL: http://libsql:8080
      TURSO_AUTH_TOKEN: local
      LISTEN_ADDR: :8080
      # The scraper runs inside this process: at start-up, then every hour, and
      # the weekly digest on Sunday 19:00 Lisbon. Set SCRAPER_ENABLED=false to
      # run the dashboard only.
      # Seeds the watches table when it is empty; after that the hubs are
      # managed on the dashboard's Watches page.
      TICKETLINE_HUB_PAGES: >-
        https://www.ticketline.pt/evento/auchan-live-academia-maia-98164,
        https://www.ticketline.pt/evento/auchan-live-academia-aveiro-98167
      # Delivery channels: one whose variables are not all set is disabled.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Optional: minimum time between sends (Go duration, default 3s, 0 = off)
      # TELEGRAM_MIN_SEND_INTERVAL: 3s
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Local testing only: send in cleartext when the relay offers no STARTTLS.
      # SMTP_ALLOW_PLAINTEXT: "true"
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  nats-data:
  libsql-data:
